[system]
compatible=boardname
bootloader=custom
max-bundle-download-size=104857600
statusfile=/var/data/secure/rauc/central.raucs
mountprefix=/tmp/rauc

[keyring]
path=cert.pem
use-bundle-signing-time=true

[slot.rootfs.A]
device=/dev/rootfsA
type=raw
parent = boot.A

[slot.rootfs.B]
device=/dev/rootfsB
type=raw
parent = boot.B

[handlers]
bootloader-custom-backend=/lib/rauc/bootloaderscript.sh
post-install=/lib/rauc/post-install.sh
