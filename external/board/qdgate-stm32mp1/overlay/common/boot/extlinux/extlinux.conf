label %DTB_NAME%-buildroot
  kernel /boot/zImage
  devicetree /boot/%DTB_NAME%.dtb
  # SD layout: p1=fsbl1, p2=fsbl2, p3=metadata1, p4=metadata2,
  # p5=fip-a, p6=fip-b, p7=u-boot-env, p8=bootfsA, p9=bootfsB,
  # p10=rootfsA, p11=rootfsB, p12=dataA, p13=dataB.
  # The factory image starts with slot A selected.
  append root=PARTLABEL=rootfsA rootwait
